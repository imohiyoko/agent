name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap and staticcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 のランナーは非特権のユーザー名前空間を AppArmor で止めている。bwrap のテストのために外す
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check.sh

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Rule changes are marked [rules]
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(AGENTS\.md|CLAUDE\.md|\.github/|\.claude/|scripts/check\.sh)'; then
            case "$TITLE" in
              *"[rules]"*) echo "ok: title has [rules]" ;;
              *) echo "::error::This PR changes rules, CI or skills. Put [rules] in the title (AGENTS.md)."; exit 1 ;;
            esac
          fi
      - name: Code changes that touch the boundary come with tests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          code=$(echo "$changed" | grep -E '^internal/(spec|egress|sandbox|mcpgw|auth)/.*\.go$' | grep -v '_test\.go$' || true)
          tests=$(echo "$changed" | grep -E '_test\.go$' || true)
          if [ -n "$code" ] && [ -z "$tests" ]; then
            echo "::error::Boundary code changed without test changes (docs/review.md 5):"; echo "$code"; exit 1
          fi
